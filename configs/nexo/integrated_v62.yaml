lesion_profile: lesion_none
use_legacy_adapter: true
disable_processes: []

tracing:
  export_path: results/traces/integrated_v62_trace.json

replication:
  export_dir: results/replication/integrated_v62

correction:
  method: benjamini_hochberg
  alpha: 0.05

meta_analysis:
  replication_root: results/replication
  export_path: results/meta_analysis/integrated_v62_summary.json

cross_battery:
  reports:
    v14: results/integrated_battery/report_v14.json
    v15: results/integrated_battery/report_v15.json
  export_path: results/cross_battery/v14_v15_comparison.json

deliberation_weight:
  export_path: results/deliberation_weight/integrated_v62_audit.json

scale:
  export_path: results/scale/integrated_v62_profile.json

lif_scale:
  export_path: results/lif_scale/integrated_v62_probe.json
  profile_key: compact
  ticks: 2
  run_bench: false

gpu_bench:
  export_path: results/gpu_bench/integrated_v62_ci.json
  profile_key: compact
  ticks: 1
  ci_safe: true

publication:
  export_dir: results/publication/integrated_v62

paper_pack:
  export_dir: results/paper_pack/integrated_v62

battery_paper:
  export_dir: results/battery_paper/integrated_v62
