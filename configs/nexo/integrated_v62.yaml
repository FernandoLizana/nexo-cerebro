    v15_mini: results/integrated_battery/report_v15_mini.json
    v15: results/integrated_battery/report_v15.json

paper_figures:
  export_dir: results/figures/integrated_v62
  report_path: results/integrated_battery/report_v15_mini.json

latex_master:
  export_dir: results/latex_master/integrated_v62

full_publication:
  export_dir: results/full_publication/integrated_v62

battery_full:
