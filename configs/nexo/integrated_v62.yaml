release_bundle:
  export_dir: results/release/integrated_v62

pipeline:
  auto_run: false
  manifest: configs/battery/integrated_v15_mini.yaml
  export_path: results/pipeline/integrated_v62_pipeline.json

pipeline_paper:
  auto_run: true
  manifest: configs/battery/integrated_v15_mini.yaml
