<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Ingreso — Web Lab P5</title>
  <style>
    body { font-family: sans-serif; max-width: 520px; margin: 2rem auto; }
    input { font-size: 1rem; padding: 0.4rem; width: 100%; margin: 0.5rem 0; }
    button { padding: 0.5rem 1rem; }
  </style>
</head>
<body>
  <h1>Ingresa tu código de acceso</h1>
  <p>El código no se muestra en esta pantalla.</p>
  <form action="success.html" method="get">
    <label for="code">Código</label>
    <input id="code" name="code" type="text" placeholder="Código de acceso" />
    <button type="submit">Validar</button>
  </form>
</body>
</html>
