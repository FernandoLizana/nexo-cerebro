<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Plan — Web Lab</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 2rem auto; }
    .plans { display: flex; gap: 1rem; margin-top: 1rem; }
    button { padding: 0.75rem 1.25rem; font-size: 1rem; }
  </style>
</head>
<body>
  <h1>Seleccione plan</h1>
  <p id="greeting"></p>
  <div class="plans">
    <button data-testid="plan-basic" type="button" onclick="go('basic')">Básico</button>
    <button data-testid="plan-pro" type="button" onclick="go('pro')">Pro</button>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const name = params.get('name') || 'Nexo';
    document.getElementById('greeting').textContent = 'Hola, ' + name;
    function go(plan) {
      location.href = 'summary.html?name=' + encodeURIComponent(name) + '&plan=' + plan;
    }
  </script>
</body>
</html>
