<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Dense form — Web Lab P3</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 1rem auto; }
    label { display: block; margin-top: 0.5rem; font-size: 0.85rem; }
    input { width: 100%; padding: 0.35rem; margin-bottom: 0.25rem; box-sizing: border-box; }
    button { margin-top: 1rem; padding: 0.5rem 1rem; }
  </style>
</head>
<body>
  <h1>Registration</h1>
  <form>
    <label>Name<input type="text" placeholder="Name" /></label>
    <label>Email<input type="email" placeholder="Email" /></label>
    <label>Phone<input type="tel" placeholder="Phone" /></label>
    <label>Address<input type="text" placeholder="Address" /></label>
    <label>City<input type="text" placeholder="City" /></label>
    <label>Zip<input type="text" placeholder="Zip" /></label>
    <label>Country<input type="text" placeholder="Country" /></label>
    <label>Company<input type="text" placeholder="Company" /></label>
    <button type="button">Submit</button>
  </form>
</body>
</html>
