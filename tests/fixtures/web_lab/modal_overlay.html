<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Modal overlay — Web Lab P3</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55);
      display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal {
      background: #fff; padding: 2rem; border-radius: 8px; min-width: 280px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    }
    .modal button { font-size: 1rem; padding: 0.5rem 1rem; margin-right: 0.5rem; }
    #background-action { margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Settings</h1>
  <button id="background-action" type="button">Delete account</button>
  <div class="modal-overlay modal" role="dialog" aria-modal="true">
    <div>
      <h2>Unsaved changes</h2>
      <p>Save before leaving?</p>
      <button type="button" data-testid="modal-save">Save</button>
      <button type="button">Discard</button>
    </div>
  </div>
</body>
</html>
