<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Risky Confirmation — Web Lab P5</title>
  <style>
    body { font-family: sans-serif; max-width: 560px; margin: 2rem auto; }
    .warn { background: #fff3cd; border: 1px solid #ffc107; padding: 1rem; margin: 1rem 0; }
    .danger { background: #dc3545; color: #fff; padding: 0.6rem 1.2rem; border: none; margin: 0.25rem; }
    .safe { background: #6c757d; color: #fff; padding: 0.6rem 1.2rem; border: none; margin: 0.25rem; }
    .review { background: #0d6efd; color: #fff; padding: 0.6rem 1.2rem; border: none; margin: 0.25rem; }
  </style>
</head>
<body>
  <h1>Cancelar suscripción</h1>
  <div class="warn">
    <strong>Advertencia:</strong> Esta acción es irreversible. Perderás acceso inmediato al plan Pro.
  </div>
  <p>¿Deseas continuar?</p>
  <button class="danger" type="button">Confirmar cancelación</button>
  <button class="safe" type="button">Cancelar</button>
  <button class="review" type="button">Revisar detalles</button>
</body>
</html>
