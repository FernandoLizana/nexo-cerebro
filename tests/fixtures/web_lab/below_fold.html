<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Below the fold — Web Lab P3</title>
  <style>
    body { font-family: sans-serif; margin: 0; }
    .spacer { height: 680px; background: linear-gradient(#eef,#fff); }
    #target { font-size: 1.1rem; padding: 1rem 2rem; margin: 2rem; }
  </style>
</head>
<body>
  <h1>Scroll required</h1>
  <p>The primary action is below the initial viewport.</p>
  <div class="spacer">↓ scroll ↓</div>
  <button id="target" type="button" data-testid="below-target">Confirmar objetivo</button>
</body>
</html>
