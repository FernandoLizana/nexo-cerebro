<!DOCTYPE html>
<html lang="es">
<head>

  <title>Novice Navigation — Web Lab P5</title>
  <style>
    body { font-family: sans-serif; margin: 0; }
    header { display: flex; align-items: center; padding: 0.75rem 1rem; background: #222; color: #fff; }

    <span style="margin-left: 1rem;">Portal</span>
    <button type="button" style="margin-left: auto; background: none; border: none; color: #fff;" aria-label="Ajustes">⚙</button>
  </header>
  <nav id="menu">

  </nav>
  <main>
    <h1>Bienvenido</h1>

  </main>
</body>
</html>
