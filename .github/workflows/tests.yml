name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,browser]"
          playwright install chromium
      - name: Dependency consistency
        run: python -m scripts.check_dependency_consistency
      - name: Pytest suite
        run: |
          python -m pytest tests/ -q --cov=brain --cov=nexo --cov=experiments --cov-report=term-missing --cov-report=xml:reports/coverage.xml --junitxml=reports/pytest-report.xml
          python - <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET
          p = pathlib.Path("reports/pytest-report.xml")
          if not p.exists():
              print("ERROR: missing junit report"); sys.exit(1)
          root = ET.parse(p).getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          total = sum(int(s.attrib.get("tests", 0)) for s in suites)
          if total < 850:
              print(f"ERROR: junit tests={total} below floor 850"); sys.exit(1)
          print(f"junit_tests={total}")
          cov = pathlib.Path("reports/coverage.xml")
          if not cov.exists():
              print("ERROR: missing coverage.xml"); sys.exit(1)
          print(f"coverage_xml={cov}")
          PY
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexo-coverage
          path: reports/coverage.xml
          if-no-files-found: warn
      - name: Dyad autonomy proof (no external services)
        run: python scripts/proof_dyad_autonomy.py
      - name: Hardening smoke scripts
        run: |
          python scripts/proof_dyad_autonomy.py
          python scripts/smoke_lab_gateway.py
      - name: Integrated battery smoke
        run: python -m experiments.integrated_battery.run_battery --seeds 42 --ablations integrated_full --lesions lesion_none --latency-mode integrated --benchmark results/integrated_battery/ci_benchmark.json
      - name: Integrated manifest smoke
        run: python -m experiments.integrated_battery.run_manifest --manifest configs/battery/integrated_v19_mini.yaml
      - name: Smoke experiments
        run: python -m experiments.run_smoke_experiments
      - name: Verify workspace
        run: python -m scripts.verify_artifact
      - name: Build artifact
        run: python scripts/build_release_artifact.py
      - name: Verify packaged artifact
        run: python -m scripts.verify_packaged_artifact --skip-install
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nexo-reports
          path: |
            reports/
            results/smoke/
            dist/
